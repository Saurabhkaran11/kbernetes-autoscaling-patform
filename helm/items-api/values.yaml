# Default values for the items-api chart. Override per environment with -f or --set.
#
# Example:
#   helm upgrade --install items-api helm/items-api -n autoscale-helm \
#     --set image.tag=v4 --set autoscaling.maxReplicas=10

image:
  repository: items-api
  tag: v4                    # must be loaded into kind: kind load docker-image items-api:v4
  pullPolicy: IfNotPresent   # kind has no registry; use the side-loaded image

# Non-secret settings, injected as env vars. Changing any value changes the pod
# template's checksum/config annotation, which triggers a rolling restart.
config:
  APP_NAME: items-api
  APP_LOG_LEVEL: INFO
  APP_SEED_ITEMS: "true"

service:
  port: 80

# Sized from measurement (idle ~3m CPU / 37Mi; ~0.24 cores per pod at 572 req/s).
resources:
  requests: { cpu: 100m, memory: 96Mi }
  limits:   { cpu: 500m, memory: 192Mi }

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 120

# Seconds the pod keeps serving after it's marked terminating, so every node stops routing
# to it before SIGTERM. Measured: 1–2 failed requests per pod kill without it, 0 with it.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  # Namespaces allowed to call the API (besides Prometheus, below).
  allowedClientNamespaces: [loadtest]
  prometheus:
    namespace: monitoring
    podLabels: { app.kubernetes.io/name: prometheus }
