# ClusterIP Service. It carries app.kubernetes.io/name on its OWN metadata because the
# Prometheus ServiceMonitor selects Services by label (a lesson from Phase 6).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "items-api.fullname" . }}
  labels:
    {{- include "items-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "items-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
