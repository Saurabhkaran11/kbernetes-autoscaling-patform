{{- /* Default-deny plus a narrow allow; see k8s/base/networkpolicy.yaml for the reasoning. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "items-api.fullname" . }}-default-deny-all
  labels:
    {{- include "items-api.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "items-api.fullname" . }}-allow-ingress
  labels:
    {{- include "items-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "items-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheus.podLabels | nindent 14 }}
        {{- range .Values.networkPolicy.allowedClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
