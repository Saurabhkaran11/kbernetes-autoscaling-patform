# metrics-server: collects CPU/memory from every kubelet and serves the metrics.k8s.io API.
#
# Why it's required: the HPA reads pod CPU from metrics.k8s.io, NOT from Prometheus.
# kind does not ship metrics-server, so without this the HPA shows
#   TARGETS: cpu: <unknown>/60%
# and never scales. `kubectl top` uses the same API.
#
# Install:  kubectl apply -k k8s/addons/metrics-server
# Verify:   kubectl top nodes        (numbers, not "Metrics API not available")
#
# Pinned to an exact release so the install is reproducible.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

patches:
  # kind's kubelets serve self-signed certificates that metrics-server can't verify.
  # LOCAL CLUSTERS ONLY: in a real cluster, give kubelets properly signed serving certs
  # instead of disabling TLS verification.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
